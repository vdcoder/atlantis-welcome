services:
  postgres:
    image: postgres:16-alpine
    container_name: atlantis-postgres

    environment:
      POSTGRES_USER: ${ATLANTIS_DB_USER}
      POSTGRES_PASSWORD: ${ATLANTIS_DB_PASSWORD}
      POSTGRES_DB: ${ATLANTIS_DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${ATLANTIS_DB_PORT:-5432}:5432"

    volumes:
      - atlantis-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ATLANTIS_DB_USER} -d ${ATLANTIS_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atlantis-postgres-data: